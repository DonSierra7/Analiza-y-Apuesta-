<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Apuestas</title>
    <style>
        :root {
            --bg-principal: #0d1b2a;
            --bg-tarjeta: #1b263b;
            --verde-exito: #00b4d8;
            --texto-claro: #e0e1dd;
            --texto-resaltado: #52b788;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            background: var(--bg-tarjeta);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .header-apuestas {
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-apuestas h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
        }

        .balance-box {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--texto-resaltado);
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .grupo-control {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #415a77;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: 2px solid var(--verde-exito);
        }

        button {
            background: var(--texto-resaltado);
            color: #0d1b2a;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #74c69d;
        }

        .historial {
            margin-top: 25px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .historial h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .log-item {
            font-size: 0.85rem;
            padding: 5px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }
        
        .log-hora {
            color: #8d99ae;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <!-- CABECERA DE LA APP -->
    <div class="header-apuestas">
        <h1>🏆 Central de Apuestas</h1>
        <div class="balance-box" id="pantalla-balance">$50.000 COP</div>
    </div>

    <!-- FORMULARIO DE APUESTAS -->
    <div class="grupo-control">
        <label for="selector-liga">Selecciona una Liga:</label>
        <select id="selector-liga" onchange="cargarEquipos()"></select>
    </div>

    <div class="grupo-control">
        <label for="selector-equipo">Selecciona tu Equipo:</label>
        <select id="selector-equipo"></select>
    </div>

    <div class="grupo-control">
        <label for="monto-apuesta">Monto a Apostar ($ COP):</label>
        <input type="number" id="monto-apuesta" value="5000" min="1000" step="1000">
    </div>

    <button onclick="procesarApuestaUsuario()">Colocar Apuesta</button>

    <!-- LOGS DEL SISTEMA -->
    <div class="historial">
        <h3>Historial de Operaciones</h3>
        <div id="lista-logs"></div>
    </div>
</div>

<script>
// ==========================================
// LÓGICA JAVASCRIPT (Idéntica a tu imagen)
// ==========================================

let balance = parseFloat(localStorage.getItem('bet_balance')) || 50000;
let logsSistema = JSON.parse(localStorage.getItem('bet_logs')) || [
    { mensaje: 'Bono inicial de 50.000 créditos otorgado.', hora: 'Inicio' }
];

const opcionesFecha = { day: '2-digit', month: '2-digit', year: 'numeric' };
const hoyObj = new Date();
const fechaHoy = hoyObj.toLocaleDateString('es-CO', opcionesFecha);
const semillaDia = hoyObj.getDate() + hoyObj.getMonth() + hoyObj.getFullYear();

const equiposLigas = {
    "LA_LIGA_ESPANA": ["Real Madrid", "Barcelona", "Atlético de Madrid", "Real Sociedad", "Villarreal", "Sevilla", "Athletic Club", "Real Betis"],
    "SERIE_A_ITALIA": ["Inter de Milán", "Napoli", "AC Milan", "Juventus", "AS Roma", "Atalanta", "Lazio", "Fiorentina"],
    "PREMIER_LEAGUE": ["Liverpool", "Manchester City", "Arsenal", "Chelsea", "Tottenham", "Aston Villa", "Manchester United", "Newcastle"],
    "BUNDESLIGA_ALEMANIA": ["Bayern Múnich", "Borussia Dortmund", "Bayer Leverkusen", "RB Leipzig", "Einfacht Frankfurt", "Stuttgart"],
    "LIGA_BETPLAY_COLOMBIA": ["Millonarios", "Santa Fe", "Junior", "Atlético Nacional", "América de Cali", "Deportivo Cali", "Medellín", "Tolima"]
};

// ==========================================
// FUNCIONES DE CONTROL VISUAL
// ==========================================

// Iniciar la interfaz al cargar la página
window.onload = function() {
    actualizarPantalla();
    inicializarLigas();
};

function actualizarPantalla() {
    // Actualizar balance con formato de pesos colombiano
    document.getElementById('pantalla-balance').innerText = 
        `$${balance.toLocaleString('es-CO')} COP`;
    
    // Guardar en localStorage
    localStorage.setItem('bet_balance', balance);
    localStorage.setItem('bet_logs', JSON.stringify(logsSistema));

    // Renderizar logs
    const contenedorLogs = document.getElementById('lista-logs');
    contenedorLogs.innerHTML = '';
    logsSistema.slice().reverse().forEach(log => {
        contenedorLogs.innerHTML += `
            <div class="log-item">
                <span>${log.mensaje}</span>
                <span class="log-hora">${log.hora}</span>
            </div>
        `;
    });
}

function inicializarLigas() {
    const selectorLiga = document.getElementById('selector-liga');
    selectorLiga.innerHTML = '';
    for (const liga in equiposLigas) {
        const option = document.createElement('option');
        option.value = liga;
        option.innerText = liga.replace(/_/g, ' ');
        selectorLiga.appendChild(option);
    }
    cargarEquipos();
}

function cargarEquipos() {
    const ligaSeleccionada = document.getElementById('selector-liga').value;
    const selectorEquipo = document.getElementById('selector-equipo');
    selectorEquipo.innerHTML = '';
    
    equiposLigas[ligaSeleccionada].forEach(equipo => {
        const option = document.createElement('option');
        option.value = equipo;
        option.innerText = equipo;
        selectorEquipo.appendChild(option);
    });
}

function procesarApuestaUsuario() {
    const montoInput = document.getElementById('monto-apuesta');
    const monto = parseFloat(montoInput.value);
    const equipo = document.getElementById('selector-equipo').value;
    const liga = document.getElementById('selector-liga').value.replace(/_/g, ' ');

    if (isNaN(monto) || monto <= 0) {
        alert("Por favor introduce un monto válido.");
        return;
    }

    if (monto > balance) {
        alert("¡Saldo insuficiente para realizar esta apuesta!");
        return;
    }

    // Procesar la transacción
    balance -= monto;
    
    const nuevoLog = {
        mensaje: `Apostaste $${monto.toLocaleString('es-CO')} al ${equipo} (${liga})`,
        hora: new Date().toLocaleTimeString('es-CO')
    };
    logsSistema.push(nuevoLog);

    actualizarPantalla();
    alert(`¡Apuesta registrada con éxito al ${equipo}!`);
}
</script>

</body>
</html>
