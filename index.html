<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Apuestas</title>
    <style>
        body{font-family:Arial,sans-serif;background-color:#0d1b2a;color:white;padding:15px;margin:0;}
        .header-app{background-color:#1b263b;padding:15px;text-align:center;border-radius:8px;margin-bottom:20px;}
        .balance-destacado{font-size:1.5rem;color:#00b4d8;font-weight:bold;}
        .liga-contenedor{background:#1b263b;margin-bottom:15px;padding:10px;border-radius:8px;}
        .partido-card{background:#415a77;padding:10px;margin:8px 0;border-radius:5px;display:flex;justify-content:space-between;align-items:center;}
        .en-vivo{color:#ff4d4d;font-weight:bold;}
        .cuotas-box button{background:#e0e1dd;color:black;border:none;padding:5px 10px;margin:0 2px;cursor:pointer;border-radius:3px;}
    </style>
</head>
<body>
<div class="header-app">
    <h2>🏆 Central de Apuestas</h2>
    <div class="balance-destacado" id="balance-pantalla">$50.000 COP</div>
</div>
<div id="contenedor-partidos"></div>
<script>
let balance = parseFloat(localStorage.getItem('bet_balance')) || 50000;
let logsSistema = JSON.parse(localStorage.getItem('bet_logs')) || [{mensaje:'Bono inicial de 50.000 créditos otorgado.',hora:'Inicio'}];
const opcionesFecha = {day:'2-digit',month:'2-digit',year:'numeric'};
const hoyObj = new Date();
const fechaHoy = hoyObj.toLocaleDateString('es-CO',opcionesFecha);
const equiposLigas = {
    "LA_LIGA_ESPANA":["Real Madrid","Barcelona","Atlético de Madrid","Real Sociedad","Villarreal","Sevilla","Athletic Club","Real Betis"],
    "SERIE_A_ITALIA":["Inter de Milán","Napoli","AC Milan","Juventus","AS Roma","Atalanta","Lazio","Fiorentina"],
    "PREMIER_LEAGUE":["Liverpool","Manchester City","Arsenal","Chelsea","Tottenham","Aston Villa","Manchester United","Newcastle"],
    "BUNDESLIGA_ALEMANIA":["Bayern Múnich","Borussia Dortmund","Bayer Leverkusen","RB Leipzig","Einfacht Frankfurt","Stuttgart"],
    "LIGA_BETPLAY_COLOMBIA":["Millonarios","Santa Fe","Junior","Atlético Nacional","América de Cali","Deportivo Cali","Medellín","Tolima"],
    "LIGA_ARGENTINA":["Boca Juniors","River Plate","Racing Club","Independiente","San Lorenzo","Vélez Sarsfield","Estudiantes","Talleres"],
    "BRASILERAO_BRASIL":["Flamengo","Palmeiras","Botafogo","São Paulo","Fluminense","Atlético Mineiro","Grêmio","Internacional"],
    "CHAMPIONS_LEAGUE":["Real Madrid","Manchester City","Bayern Múnich","PSG","Arsenal","Inter de Milán","Barcelona","Bayer Leverkusen"],
    "EUROPA_LEAGUE":["Manchester United","Tottenham","Roma","Porto","Ajax","Real Sociedad","Athletic Club","Eintracht Frankfurt"]
};
function randomConSemilla(semilla){let x=Math.sin(semilla)*10000;return x-Math.floor(x);}
function generarPartidosNuevos(){
    let partidosHoy=[];let contadorSemilla=hoyObj.getDate()+hoyObj.getMonth()+hoyObj.getFullYear();
    for(const liga in equiposLigas){
        const equipos=equiposLigas[liga];
        for(let i=0;i<equipos.length;i+=2){
            if(equipos[i]&&equipos[i+1]){
                contadorSemilla+=1;let r1=randomConSemilla(contadorSemilla);
                contadorSemilla+=2;let r2=randomConSemilla(contadorSemilla);
                let constLocal=parseFloat((1.35+r1*2.2).toFixed(2));
                let constVisitante=parseFloat((1.55+r2*3.2).toFixed(2));
                let constEmpate=parseFloat((2.70+(r1+r2)/2*1.3).toFixed(2));
                let constEstadoInicial=(i===0)?"En Vivo":"Próximamente";
                partidosHoy.push({id:`${liga.toLowerCase().slice(0,3)}_${i}`,liga:liga,local:equipos[i],visitante:equipos[i+1],estado:constEstadoInicial,golesLocal:0,golesVisitante:0,cuotas:{"Local":constLocal,"Empate":constEmpate,"Visitante":constVisitante}});
            }
        }
    }
    let estructura={fecha:fechaHoy,lista:partidosHoy};
    localStorage.setItem('partidos_del_dia_datos',JSON.stringify(estructura));
    return estructura;
}
let datosGuardados=JSON.parse(localStorage.getItem('partidos_del_dia_datos'));
if(!datosGuardados||datosGuardados.fecha!==fechaHoy){datosGuardados=generarPartidosNuevos();}
let partidosDelDia=datosGuardados.lista;
function procesarMercadoVivo(){
    partidosDelDia.forEach(partido=>{
        if(partido.estado==="Próximamente"){if(Math.random()>0.985){partido.estado="En Vivo";}}
        else if(partido.estado==="En Vivo"){
            if(Math.random()>0.85){
                if(Math.random()>0.5){
                    partido.golesLocal++;
                    partido.cuotas["Local"]=Math.max(1.05,parseFloat((partido.cuotas["Local"]-0.4).toFixed(2)));
                    partido.cuotas["Visitante"]=parseFloat((partido.cuotas["Visitante"]*1.6).toFixed(2));
                }else{
                    partido.golesVisitante++;
                    partido.cuotas["Visitante"]=Math.max(1.05,parseFloat((partido.cuotas["Visitante"]-0.4).toFixed(2)));
                    partido.cuotas["Local"]=parseFloat((partido.cuotas["Local"]*1.6).toFixed(2));
                }
                partido.cuotas["Empate"]=parseFloat((partido.cuotas["Empate"]+(Math.random()>0.5?0.4:-0.2)).toFixed(2));
            }
            if(Math.random()>0.97){partido.estado="Finalizado";}
        }
    });
    localStorage.setItem('partidos_del_dia_datos',JSON.stringify({fecha:fechaHoy,lista:partidosDelDia}));
    renderizarInterfaz();
}
function renderizarInterfaz(){
    const contenedor=document.getElementById('contenedor-partidos');
    const balPantalla=document.getElementById('balance-pantalla');
    if(balPantalla){balPantalla.innerText=balance.toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});}
    if(!contenedor)return;contenedor.innerHTML="";
    const agruparLigas={};partidosDelDia.forEach(p=>{if(!agruparLigas[p.liga])agruparLigas[p.liga]=[];agruparLigas[p.liga].push(p);});
    for(const liga in agruparLigas){
        const divLiga=document.createElement('div');divLiga.className='liga-contenedor';
        divLiga.innerHTML=`<h3>⚽ ${liga.replace(/_/g,' ')}</h3>`;
        agruparLigas[liga].forEach(p=>{
            const divPart=document.createElement('div');divPart.className='partido-card';
            let pEstado=p.estado,divPartStyleBorder="",marcador="vs";
            if(pEstado==="En Vivo"){divPartStyleBorder="border:1px solid #ff4d4d;";pEstado=`<span class="en-vivo">🔴 EN VIVO</span>`;marcador=`${p.golesLocal} - ${p.golesVisitante}`;}
            else if(pEstado==="Finalizado"){marcador=`${p.golesLocal} - ${p.golesVisitante}`;}
            divPart.style=divPartStyleBorder;
            divPart.innerHTML=`<div><div><strong>${p.local}</strong> ${marcador} <strong>${p.visitante}</strong></div><small>${pEstado}</small></div><div class="cuotas-box"><button onclick="apostar('${p.id}','Local',${p.cuotas.Local})">L: ${p.cuotas.Local}</button><button onclick="apostar('${p.id}','Empate',${p.cuotas.Empate})">E: ${p.cuotas.Empate}</button><button onclick="apostar('${p.id}','Visitante',${p.cuotas.Visitante})">V: ${p.cuotas.Visitante}</button></div>`;
            divLiga.appendChild(divPart);
        });
        contenedor.appendChild(divLiga);
    }
}
function apostar(partidoId,seleccion,valorCuota){
    let monto=prompt(`¿Cuánto deseas apostar a [${seleccion}] con cuota ${valorCuota}?`,"5000");if(!monto)return;monto=parseFloat(monto);
    if(isNaN(monto)||monto<=0||monto>balance){alert("Monto inválido o saldo insuficiente.");return;}
    balance-=monto;localStorage.setItem('bet_balance',balance);
    alert(`Apuesta realizada con éxito. Nuevo saldo: $${balance.toLocaleString('es-CO')}`);renderizarInterfaz();
}
window.onload=function(){renderizarInterfaz();setInterval(procesarMercadoVivo,4000);};
</script>
</body>
</html>
